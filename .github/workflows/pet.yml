name: Update neko

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prsdx/github-pet@v1
        with:
          username: prsdx
          timezone-offset-minutes: "330"   # UTC+5:30 (IST)
          watched-repos: "github-pet,platewise-rag,blooddonation"
          display-name: "shubham"
          pet-name: "neko"
          contact-line: "prsdx.dev@gmail.com"
