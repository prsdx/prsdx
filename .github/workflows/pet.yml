name: Update neko

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: profile-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: knowprasad/YourTomo@v1
        with:
          username: knowprasad
          timezone-offset-minutes: "330"   # UTC+5:30 (IST)
          watched-repos: "YourTomo,platewise-rag,blooddonation"
          display-name: "Shubham Prasad"
          pet-name: "neko"
          contact-line: "prsdx.dev@gmail.com"
          attribution: "false"
